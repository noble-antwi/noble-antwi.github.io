<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand" aria-label="Noble Antwi, home">
      <span class="brand-mark">NA</span>
      <span class="brand-text">
        <span class="brand-name">Noble Antwi</span>
        <span class="brand-tag">Cloud Security &amp; Identity Engineer</span>
      </span>
    </a>

    <button class="nav-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav-links">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="site-nav" aria-label="Primary">
      <ul class="nav-links" id="site-nav-links">
        <li><a href="/" {% if page.url == "/" %}class="active" aria-current="page"{% endif %}>Home</a></li>
        <li><a href="/projects" {% if page.url contains "/projects" %}class="active" aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="/certifications" {% if page.url contains "certifications" or page.url contains "/in-progress" or page.url contains "/training-courses" %}class="active" aria-current="page"{% endif %}>Certifications</a></li>
        <li><a href="/blog" {% if page.url contains "/blog" or page.layout == "post" %}class="active" aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="/contact" {% if page.url contains "/contact" %}class="active" aria-current="page"{% endif %}>Contact</a></li>
        <li class="nav-cta"><a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a></li>
      </ul>
    </nav>
  </div>
</header>

<script>
  (function() {
    var toggle = document.querySelector('.nav-toggle');
    var links = document.querySelector('.nav-links');
    if (!toggle || !links) return;
    toggle.addEventListener('click', function() {
      var isOpen = links.classList.toggle('is-open');
      toggle.classList.toggle('is-open', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });
  })();
</script>
