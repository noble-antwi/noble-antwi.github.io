<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#0b6b63"/></marker>
    <style>
      .t{font-family:Georgia,'Iowan Old Style',serif;fill:#16181d}
      .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.6px;fill:#0b6b63}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#7b8089}
      .s{fill:#4a4f58;font-size:13px}
      .box{fill:#ffffff;stroke:#ddd7cb;stroke-width:1.2}
      .dash{fill:none;stroke:#cbc4b6;stroke-width:1.2;stroke-dasharray:6 5}
      .ln{stroke:#0b6b63;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8f6f1"/>

  <text x="60" y="58" class="k">IAM JOB SCOUT · ARCHITECTURE</text>
  <text x="60" y="100" class="t" font-size="30">Three job APIs in, one de-duplicated board out.</text>
  <text x="60" y="126" class="s">A FastAPI service that runs on a schedule, keeps senior titles out, and reports on itself.</text>

  <!-- sources -->
  <g>
    <text x="60" y="178" class="k">SOURCES</text>
    <rect x="60" y="192" width="180" height="52" rx="8" class="box"/><text x="80" y="224" class="s" font-size="15" fill="#16181d">JSearch</text><text x="160" y="224" class="m">Indeed · LinkedIn</text>
    <rect x="60" y="256" width="180" height="52" rx="8" class="box"/><text x="80" y="288" class="s" font-size="15" fill="#16181d">Adzuna</text>
    <rect x="60" y="320" width="180" height="52" rx="8" class="box"/><text x="80" y="352" class="s" font-size="15" fill="#16181d">RemoteOK</text>
  </g>
  <path d="M240 218 L300 270" class="ln"/>
  <path d="M240 282 L300 282" class="ln"/>
  <path d="M240 346 L300 294" class="ln"/>

  <!-- docker compose boundary -->
  <rect x="300" y="160" width="700" height="300" rx="14" class="dash"/>
  <text x="320" y="182" class="m">docker compose</text>

  <!-- app -->
  <g>
    <rect x="320" y="200" width="300" height="170" rx="10" class="box"/>
    <rect x="320" y="200" width="300" height="4" fill="#0b6b63"/>
    <text x="340" y="232" class="k">FASTAPI SERVICE</text>
    <text x="340" y="262" class="t" font-size="20">Collect · Filter · Serve</text>
    <text x="340" y="290" class="s">APScheduler runs Mon / Wed / Sat</text>
    <text x="340" y="310" class="s">Fuzzy-match de-duplication across sources</text>
    <text x="340" y="330" class="s">Excludes senior, principal, lead, director…</text>
    <text x="340" y="350" class="s">Keeps 0 to 5 years; drops 7+ years</text>
  </g>

  <!-- db -->
  <g>
    <rect x="660" y="200" width="150" height="80" rx="10" class="box"/>
    <text x="680" y="228" class="k">STORE</text>
    <text x="680" y="256" class="t" font-size="18">PostgreSQL</text>
    <text x="680" y="272" class="m">SQLite for dev</text>
  </g>
  <path d="M620 240 L658 240" class="ln"/>

  <!-- ui -->
  <g>
    <rect x="660" y="292" width="150" height="78" rx="10" class="box"/>
    <text x="680" y="320" class="k">UI</text>
    <text x="680" y="346" class="t" font-size="18">Jinja2 · Tailwind</text>
    <text x="680" y="362" class="m">search, save, applied, hidden</text>
  </g>
  <path d="M620 330 L658 330" class="ln"/>

  <!-- metrics -->
  <g>
    <rect x="840" y="200" width="140" height="80" rx="10" class="box"/>
    <text x="860" y="228" class="k">METRICS</text>
    <text x="860" y="256" class="t" font-size="18">Prometheus</text>
    <text x="860" y="272" class="m">30+ series · /metrics</text>
    <rect x="840" y="292" width="140" height="78" rx="10" class="box"/>
    <text x="860" y="320" class="k">DASHBOARD</text>
    <text x="860" y="346" class="t" font-size="18">Grafana</text>
    <text x="860" y="362" class="m">p50 / p95 / p99, scan health</text>
  </g>
  <path d="M810 240 L838 240" class="ln"/>
  <path d="M910 280 L910 290" class="ln"/>

  <!-- protected endpoints -->
  <g>
    <rect x="320" y="390" width="660" height="50" rx="8" fill="#f0ece4" stroke="#ddd7cb"/>
    <text x="340" y="411" class="k">ACCESS CONTROL</text>
    <text x="340" y="430" class="s">Public: board, job detail, JSON API, health, metrics · Protected: manual scan and cleanup, by admin session or X-ADMIN-TOKEN</text>
  </g>

  <!-- deployments -->
  <text x="60" y="510" class="k">RUNS ON</text>
  <rect x="60" y="524" width="200" height="56" rx="8" class="box"/><text x="80" y="548" class="t" font-size="17">Render</text><text x="80" y="566" class="m">cron support, HTTPS</text>
  <rect x="280" y="524" width="200" height="56" rx="8" class="box"/><text x="300" y="548" class="t" font-size="17">Fly.io</text><text x="300" y="566" class="m">Docker, edge</text>
  <rect x="500" y="524" width="200" height="56" rx="8" class="box"/><text x="520" y="548" class="t" font-size="17">Any VPS</text><text x="520" y="566" class="m">docker compose up</text>
  <text x="1140" y="618" text-anchor="end" class="m">github.com/noble-antwi/iam-job-scout</text>
</svg>
