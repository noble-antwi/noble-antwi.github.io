<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#0b6b63"/></marker>
    <style>
      .t{font-family:Georgia,'Iowan Old Style',serif;fill:#16181d}
      .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.6px;fill:#0b6b63}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#7b8089}
      .s{fill:#4a4f58;font-size:13px}
      .box{fill:#ffffff;stroke:#ddd7cb;stroke-width:1.2}
      .ln{stroke:#0b6b63;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8f6f1"/>

  <text x="60" y="58" class="k">CYBERDYNE SYSTEMS · DEFENSE-IN-DEPTH PROGRAMME</text>
  <text x="60" y="100" class="t" font-size="30">Three layers of control, rolled out in the order that removes the most risk first.</text>
  <text x="60" y="126" class="s">400 employees, California and Taiwan, 800+ devices. Sixteen vulnerabilities found; the fleet running end-of-life operating systems is the one that matters most.</text>

  <!-- layers (nested) -->
  <g>
    <rect x="60" y="170" width="520" height="300" rx="14" fill="#f0ece4" stroke="#ddd7cb"/>
    <text x="80" y="200" class="k">HUMAN LAYER · 8 PROGRAMMES</text>
    <text x="80" y="222" class="s">Role-based training, phishing drills, onboarding, engineering-specific modules</text>

    <rect x="90" y="240" width="460" height="210" rx="12" fill="#ffffff" stroke="#ddd7cb"/>
    <text x="110" y="270" class="k">POLICY LAYER · 11 POLICIES</text>
    <text x="110" y="292" class="s">Acceptable use, data classification, incident response, access control,</text>
    <text x="110" y="310" class="s">removable media, vendor management, change management…</text>

    <rect x="120" y="326" width="400" height="104" rx="10" fill="#f8f6f1" stroke="#0b6b63"/>
    <text x="140" y="354" class="k">TECHNOLOGY LAYER · 13 CONTROLS</text>
    <text x="140" y="378" class="s">Active Directory · SIEM · VPN with MFA · full-disk encryption</text>
    <text x="140" y="398" class="s">EDR · MDM · host firewalls · DLP · standard images</text>
    <text x="140" y="418" class="s">USB device control · asset management · patching</text>
  </g>

  <!-- findings -->
  <g>
    <rect x="620" y="170" width="520" height="140" rx="10" class="box"/>
    <text x="640" y="200" class="k">WHAT WAS FOUND</text>
    <text x="640" y="228" class="s"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#b3261e">CRITICAL</tspan>  800+ devices on end-of-life OS (Ubuntu 10.04, Windows 10 1607)</text>
    <text x="640" y="250" class="s"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#b3261e">CRITICAL</tspan>  No central endpoint protection; unencrypted site-to-site transport</text>
    <text x="640" y="272" class="s"><tspan font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#b45309">HIGH</tspan>  No central identity; no full-disk encryption; open USB ports</text>
    <text x="640" y="296" class="m">frameworks: NIST CSF · NIST 800-171 · CCPA · PDPC · FAR / DFARS</text>
  </g>

  <!-- phased rollout -->
  <g>
    <text x="620" y="352" class="k">ROLLOUT</text>
    <rect x="620" y="366" width="160" height="104" rx="10" class="box"/><rect x="620" y="366" width="160" height="4" fill="#0b6b63"/>
    <text x="638" y="394" class="t" font-size="17">Phase 1</text>
    <text x="638" y="414" class="s">OS upgrades · EDR</text>
    <text x="638" y="432" class="s">Full-disk encryption</text>
    <text x="638" y="450" class="s">Active Directory</text>
    <path d="M780 418 L798 418" class="ln"/>
    <rect x="800" y="366" width="160" height="104" rx="10" class="box"/><rect x="800" y="366" width="160" height="4" fill="#0b6b63"/>
    <text x="818" y="394" class="t" font-size="17">Phase 2</text>
    <text x="818" y="414" class="s">SIEM · VPN + MFA</text>
    <text x="818" y="432" class="s">MDM · host firewalls</text>
    <path d="M960 418 L978 418" class="ln"/>
    <rect x="980" y="366" width="160" height="104" rx="10" class="box"/><rect x="980" y="366" width="160" height="4" fill="#0b6b63"/>
    <text x="998" y="394" class="t" font-size="17">Phase 3</text>
    <text x="998" y="414" class="s">Standard images · DLP</text>
    <text x="998" y="432" class="s">Asset management</text>
    <text x="998" y="450" class="s">USB control</text>
  </g>

  <!-- footer facts -->
  <rect x="60" y="510" width="1080" height="56" rx="8" class="box"/>
  <text x="80" y="533" class="k">WHY IDENTITY IS IN PHASE 1</text>
  <text x="80" y="553" class="s">Without a directory there is no way to enforce MFA, scope access or attribute an event to a person. Every later control depends on it, so it goes in with the OS refresh, not after.</text>
  <text x="1140" y="618" text-anchor="end" class="m">github.com/noble-antwi/cyberdyne-security-assessment</text>
</svg>
