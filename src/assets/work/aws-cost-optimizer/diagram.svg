<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#0b6b63"/></marker>
    <style>
      .t{font-family:Georgia,'Iowan Old Style',serif;fill:#16181d}
      .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.6px;fill:#0b6b63}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#7b8089}
      .s{fill:#4a4f58;font-size:13px}
      .box{fill:#ffffff;stroke:#ddd7cb;stroke-width:1.2}
      .ln{stroke:#0b6b63;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8f6f1"/>

  <text x="60" y="58" class="k">AWS COST OPTIMIZER · HOW A FINDING IS MADE</text>
  <text x="60" y="100" class="t" font-size="30">Read every region, measure what is actually used, report what is not.</text>
  <text x="60" y="126" class="s">A read-only Boto3 CLI. Detection thresholds are configurable; the output is a report, not a change.</text>

  <!-- column 1: inventory -->
  <g>
    <rect x="60" y="180" width="250" height="300" rx="10" class="box"/>
    <rect x="60" y="180" width="250" height="4" fill="#0b6b63"/>
    <text x="80" y="212" class="k">01 · INVENTORY</text>
    <text x="80" y="242" class="t" font-size="20">All regions, in parallel</text>
    <text x="80" y="272" class="s">EC2 instances</text>
    <text x="80" y="294" class="s">EBS volumes and snapshots</text>
    <text x="80" y="316" class="s">Elastic IPs</text>
    <text x="80" y="338" class="s">RDS instances</text>
    <text x="80" y="400" class="m">IAM: describe / list / get only</text>
    <text x="80" y="418" class="m">no write permissions required</text>
  </g>
  <path d="M310 330 L358 330" class="ln"/>

  <!-- column 2: measure -->
  <g>
    <rect x="360" y="180" width="250" height="300" rx="10" class="box"/>
    <rect x="360" y="180" width="250" height="4" fill="#0b6b63"/>
    <text x="380" y="212" class="k">02 · MEASURE</text>
    <text x="380" y="242" class="t" font-size="20">CloudWatch metrics</text>
    <text x="380" y="272" class="s">Average CPU over 7 days</text>
    <text x="380" y="294" class="s">Database connections over 7 days</text>
    <text x="380" y="316" class="s">Volume attachment state and age</text>
    <text x="380" y="338" class="s">Snapshot age</text>
    <text x="380" y="360" class="s">Elastic IP association</text>
    <text x="380" y="400" class="m">real utilisation, not guesses</text>
  </g>
  <path d="M610 330 L658 330" class="ln"/>

  <!-- column 3: detect -->
  <g>
    <rect x="660" y="180" width="250" height="300" rx="10" class="box"/>
    <rect x="660" y="180" width="250" height="4" fill="#0b6b63"/>
    <text x="680" y="212" class="k">03 · DETECT</text>
    <text x="680" y="242" class="t" font-size="20">Configurable thresholds</text>
    <text x="680" y="272" class="s"><tspan fill="#16181d" font-weight="600">Idle EC2</tspan>  CPU below 5%</text>
    <text x="680" y="294" class="s"><tspan fill="#16181d" font-weight="600">Unattached EBS</tspan>  for N days</text>
    <text x="680" y="316" class="s"><tspan fill="#16181d" font-weight="600">Old snapshots</tspan>  beyond 90 days</text>
    <text x="680" y="338" class="s"><tspan fill="#16181d" font-weight="600">Unused EIPs</tspan>  not associated</text>
    <text x="680" y="360" class="s"><tspan fill="#16181d" font-weight="600">Idle RDS</tspan>  CPU below 5%, under 1 connection</text>
    <text x="680" y="400" class="m">each finding carries an estimated</text>
    <text x="680" y="418" class="m">monthly and annual saving</text>
  </g>
  <path d="M910 330 L958 330" class="ln"/>

  <!-- column 4: report -->
  <g>
    <rect x="960" y="180" width="180" height="300" rx="10" class="box"/>
    <rect x="960" y="180" width="180" height="4" fill="#0b6b63"/>
    <text x="980" y="212" class="k">04 · REPORT</text>
    <text x="980" y="242" class="t" font-size="20">Three formats</text>
    <text x="980" y="272" class="s">JSON for automation</text>
    <text x="980" y="294" class="s">CSV for spreadsheets</text>
    <text x="980" y="316" class="s">HTML for people</text>
    <text x="980" y="400" class="m">the decision to act</text>
    <text x="980" y="418" class="m">stays with a human</text>
  </g>

  <!-- footnote -->
  <rect x="60" y="520" width="1080" height="56" rx="8" fill="#ffffff" stroke="#ddd7cb"/>
  <text x="80" y="543" class="k">DESIGN CHOICE</text>
  <text x="80" y="563" class="s">The tool never modifies an account. It makes waste visible with evidence and a number attached, so that stopping, resizing or deleting is a deliberate decision rather than a script's side effect.</text>
  <text x="1140" y="618" text-anchor="end" class="m">github.com/noble-antwi/aws-cost-optimizer</text>
</svg>
