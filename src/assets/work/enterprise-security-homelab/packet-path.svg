<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#0b6b63"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#b3261e"/></marker>
    <style>
      .t{font-family:Georgia,'Iowan Old Style',serif;fill:#16181d}
      .k{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:1.6px;fill:#0b6b63}
      .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:#7b8089}
      .s{fill:#4a4f58;font-size:13px}
      .box{fill:#ffffff;stroke:#ddd7cb;stroke-width:1.2}
      .ln{stroke:#0b6b63;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .no{stroke:#b3261e;stroke-width:1.6;fill:none;marker-end:url(#r);stroke-dasharray:5 5}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#f8f6f1"/>

  <text x="60" y="58" class="k">ENTERPRISE SECURITY HOMELAB · THE PATH OF ONE PACKET</text>
  <text x="60" y="100" class="t" font-size="30">Every packet that crosses a segment is a firewall decision.</text>
  <text x="60" y="126" class="s">pfSense holds the gateway on all six VLANs, so nothing moves between them without matching an explicit, justified rule.</text>

  <!-- origin VM -->
  <g>
    <rect x="60" y="190" width="190" height="110" rx="10" class="box"/>
    <rect x="60" y="190" width="190" height="4" fill="#0b6b63"/>
    <text x="80" y="220" class="k">01 · GUEST</text>
    <text x="80" y="248" class="t" font-size="18">KALI01</text>
    <text x="80" y="270" class="s">VLAN 30 tag on the virtual NIC</text>
    <text x="80" y="288" class="m">192.168.30.10</text>
  </g>
  <path d="M250 245 L298 245" class="ln"/>

  <!-- bridge -->
  <g>
    <rect x="300" y="190" width="190" height="110" rx="10" class="box"/>
    <rect x="300" y="190" width="190" height="4" fill="#0b6b63"/>
    <text x="320" y="220" class="k">02 · HYPERVISOR</text>
    <text x="320" y="248" class="t" font-size="18">VLAN-aware bridge</text>
    <text x="320" y="270" class="s">Proxmox keeps the 802.1Q tag;</text>
    <text x="320" y="288" class="s">placement is one number per VM.</text>
  </g>
  <path d="M490 245 L538 245" class="ln"/>

  <!-- trunk -->
  <g>
    <rect x="540" y="190" width="190" height="110" rx="10" class="box"/>
    <rect x="540" y="190" width="190" height="4" fill="#0b6b63"/>
    <text x="560" y="220" class="k">03 · TRUNK</text>
    <text x="560" y="248" class="t" font-size="18">Managed switch</text>
    <text x="560" y="270" class="s">Tagged frames carried to</text>
    <text x="560" y="288" class="s">pfSense on the trunk port.</text>
  </g>
  <path d="M730 245 L778 245" class="ln"/>

  <!-- firewall -->
  <g>
    <rect x="780" y="170" width="360" height="150" rx="10" class="box"/>
    <rect x="780" y="170" width="360" height="4" fill="#0b6b63"/>
    <text x="800" y="200" class="k">04 · PFSENSE · REDTEAM RULESET</text>
    <text x="800" y="228" class="s"><tspan fill="#16181d" font-weight="600">Allow</tspan>  DNS and NTP to the firewall itself</text>
    <text x="800" y="250" class="s"><tspan fill="#16181d" font-weight="600">Allow</tspan>  internet, for tooling updates</text>
    <text x="800" y="272" class="s"><tspan fill="#b3261e" font-weight="600">Block</tspan>  every other VLAN, logged</text>
    <text x="800" y="294" class="s"><tspan fill="#b3261e" font-weight="600">Block</tspan>  the firewall management plane</text>
    <text x="800" y="312" class="m">each rule: purpose, owner, NIST control, review date</text>
  </g>

  <!-- outcomes -->
  <path d="M960 320 L960 372" class="ln"/>
  <g>
    <rect x="860" y="374" width="200" height="70" rx="10" class="box"/>
    <text x="880" y="400" class="k">PERMITTED</text>
    <text x="880" y="424" class="s">internet, DNS, NTP</text>
  </g>
  <path d="M1140 245 C 1180 245, 1180 400, 1160 400" class="no"/>
  <text x="1120" y="470" text-anchor="end" class="m" fill="#b3261e">DC01 · SIEM01 · pfSense admin: unreachable, and the attempt is logged</text>

  <!-- proof -->
  <g>
    <rect x="60" y="374" width="700" height="70" rx="10" fill="#f0ece4" stroke="#ddd7cb"/>
    <text x="80" y="400" class="k">PROVEN, NOT ASSUMED</text>
    <text x="80" y="424" class="s">A containment test from KALI01 records the failed reachability to DC01 and the management plane; the screenshot is filed as evidence against the rule.</text>
  </g>

  <!-- segments legend -->
  <text x="60" y="510" class="k">THE SIX SEGMENTS</text>
  <text x="60" y="540" class="s"><tspan fill="#16181d" font-weight="600">10</tspan> Management   <tspan fill="#16181d" font-weight="600">20</tspan> BlueTeam · SIEM01   <tspan fill="#16181d" font-weight="600">30</tspan> RedTeam · KALI01   <tspan fill="#16181d" font-weight="600">40</tspan> DevOps · VAULT01   <tspan fill="#16181d" font-weight="600">50</tspan> EnterpriseLAN · DC01   <tspan fill="#16181d" font-weight="600">60</tspan> Monitoring · MON01</text>
  <text x="60" y="566" class="m">three of six rulesets hardened to default deny so far; the rest are the next runbooks</text>
  <text x="1140" y="618" text-anchor="end" class="m">github.com/noble-antwi/enterprise-security-homelab</text>
</svg>
