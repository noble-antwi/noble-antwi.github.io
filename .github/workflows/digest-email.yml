name: Email the lab digest

# The weekly cloud routine opens an issue labelled "digest". GitHub does not
# notify an account about issues it created itself, so this workflow emails
# the body through Resend instead. It can also be run by hand for any issue.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to email
        required: true

permissions:
  issues: read
  contents: read

jobs:
  email:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'digest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.inputs.issue || github.event.issue.number }}
        run: |
          gh issue view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body,url > issue.json
          jq -r .title issue.json > title.txt
          jq -r .body  issue.json > body.md
          jq -r .url   issue.json > url.txt

      - name: Render the email
        run: |
          mkdir -p /tmp/render && cp scripts/digest-email.mjs /tmp/render/ && (cd /tmp/render && npm init -y >/dev/null && npm install marked >/dev/null 2>&1)
          node /tmp/render/digest-email.mjs body.md "$(cat title.txt)" "$(cat url.txt)" > email.html
          jq -n --rawfile html email.html --rawfile text body.md --arg subject "$(cat title.txt)"             '{from: "Lab digest <digest@nobleantwi.com>", to: ["nobleantwi3@gmail.com"], subject: $subject, html: $html, text: $text}' > payload.json

      - name: Send through Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY secret is not set; skipping the email. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          code=$(curl -s -o response.json -w '%{http_code}' -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" -d @payload.json)
          cat response.json; echo
          [ "$code" = "200" ] || [ "$code" = "201" ] || { echo "Resend returned HTTP $code"; exit 1; }
