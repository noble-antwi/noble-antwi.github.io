eAccounts</text><rect x="138" y="483" width="250" height="26" rx="6" fill="#ffffff" stroke="#c3cad6" stroke-width="1.3" /><text x="148" y="501" font-family="Inter, system-ui, sans-serif" font-size="13px" font-weight="600" fill="#16181d">svc-greenbone</text><text x="400" y="501" font-family="Inter, system-ui, sans-serif" font-size="12px" fill="#5f646d">the scan login</text><rect x="60" y="519" width="290" height="26" rx="6" fill="#fff5f4" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4" /><text x="70" y="537" font-family="Inter, system-ui, sans-serif" font-size="13px" font-weight="600" fill="#16181d">Domain Controllers</text><text x="362" y="537" font-family="Inter, system-ui, sans-serif" font-size="12px" fill="#b91c1c">a separate branch, not linked</text><rect x="86" y="555" width="290" height="26" rx="6" fill="#fff5f4" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="5 4" /><text x="96" y="573" font-family="Inter, system-ui, sans-serif" font-size="13px" font-weight="600" fill="#16181d">DC01</text><text x="388" y="573" font-family="Inter, system-ui, sans-serif" font-size="12px" fill="#b91c1c">never receives the policy</text>
  <rect x="20" y="622" width="640" height="72" rx="10" fill="#ffffff" stroke="#d5dae3" />
  <text x="40" y="650" font-family="Inter, system-ui, sans-serif" font-size="13px" font-weight="700" fill="#16181d">A policy flows down from where it is linked, and only down.</text>
  <text x="40" y="672" font-family="Inter, system-ui, sans-serif" font-size="13px" fill="#4a4f58">Everything under Computers receives it. Domain Controllers is a separate branch,</text>
  <text x="40" y="690" font-family="Inter, system-ui, sans-serif" font-size="13px" fill="#4a4f58">so DC01 is outside the grant by where the link sits, not by a setting.</text>
</svg>
