<svg xmlns="http://www.w3.org/2000/svg" width="680" height="714" viewBox="0 0 680 714" role="img" aria-labelledby="t d">
  <title id="t">Where the policy is linked in the directory</title>
  <desc id="d">The SEC-Scanner-Access Group Policy is linked to the Computers container inside BIIRA. Servers, Workstations and the workstation WKS01 sit beneath it and receive it. The Domain Controllers container is a separate branch with no link, so DC01 never receives the policy. The scan login svc-greenbone and the group SG-Scanner-LocalAdmin live in their own containers.</desc>
  <rect width="680" height="714" fill="#f7f8fa" />
  <text x="34" y="34" font-family="'JetBrains Mono', Consolas, monospace" font-size="11px" letter-spacing="1.4" fill="#5f646d">ACTIVE DIRECTORY ON DC01 · WHERE THINGS LIVE</text>
