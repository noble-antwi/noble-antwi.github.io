<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" role="img" aria-labelledby="t d">
  <title id="t">Who does what during a credentialed scan</title>
  <desc id="d">SCAN01 on VLAN 20 signs in to WKS01 on VLAN 50 over SMB, crossing pfSense. WKS01 asks the domain controller DC01 whether the credential is valid. DC01's Group Policy places the scanner's group in WKS01's local Administrators. The Wazuh agent on WKS01 sends every sign-in to SIEM01 on VLAN 20.</desc>
  <style>
    .bg { fill: #f7f8fa; }
    .zone { fill: #ffffff; stroke: #d5dae3; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .box { fill: #ffffff; stroke: #c3cad6; stroke-width: 1.3; }
    .box.fw { fill: #eef6f5; stroke: #0b6b63; stroke-width: 1.6; }
    .box.dc { stroke: #6d28d9; stroke-width: 1.7; }
    .box.tgt { stroke: #0b6b63; stroke-width: 1.7; }
    .box.siem { stroke: #1d4ed8; stroke-width: 1.6; }
    .zl { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; fill: #5f646d; }
    .n { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #16181d; }
    .s { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; fill: #4a4f58; }
    .m { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #4a4f58; }
    .w { fill: none; stroke: #6b7280; stroke-width: 1.8; }
    .w.dash { stroke-dasharray: 5 4; }
    .step { fill: #16181d; }
    .stept { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .leg { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #16181d; }
</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b7280"/></marker></defs>
  <rect class="bg" width="680" height="800" />

  <rect class="zone" x="20" y="20" width="640" height="176" rx="14" />
  <text class="zl" x="40" y="46" fill="#0b6b63">VLAN 20 · BlueTeam</text>
  <rect class="box" x="40" y="62" width="270" height="116" rx="10" />
  <text class="n" x="58" y="90">SCAN01 · the scanner</text>
  <text class="s" x="58" y="112">Greenbone, holds the scan login</text>
  <text class="m" x="58" y="136">svc-greenbone</text>
  <text class="m" x="58" y="158">192.168.20.3</text>
  <rect class="box siem" x="370" y="62" width="270" height="116" rx="10" />
  <text class="n" x="388" y="90">SIEM01 · Wazuh</text>
  <text class="s" x="388" y="112">records every sign-in on</text>
  <text class="s" x="388" y="130">the machines it watches</text>
  <text class="m" x="388" y="158">192.168.20.2</text>

  <rect class="box fw" x="20" y="232" width="640" height="58" rx="10" />
  <text class="n" x="40" y="258">FW01 · pfSense</text>
  <text class="s" x="40" y="278">sits between every segment, so every packet below crosses a firewall rule</text>

  <rect class="zone" x="20" y="326" width="640" height="300" rx="14" />
  <text class="zl" x="40" y="352" fill="#6d28d9">VLAN 50 · EnterpriseLAN</text>
  <rect class="box dc" x="40" y="370" width="250" height="236" rx="10" />
  <text class="n" x="58" y="398">DC01</text>
  <text class="s" x="58" y="418">the domain controller</text>
  <text class="s" x="58" y="448">Active Directory lives here:</text>
  <text class="m" x="58" y="472">the account</text>
  <text class="m" x="58" y="494">the group</text>
  <text class="m" x="58" y="516">the Group Policy</text>
  <text class="m" x="58" y="580">192.168.50.2</text>
  <rect class="box tgt" x="390" y="370" width="250" height="236" rx="10" />
  <text class="n" x="408" y="398">WKS01</text>
  <text class="s" x="408" y="418">the machine being scanned</text>
  <text class="s" x="408" y="448">What the policy gives it:</text>
  <text class="m" x="408" y="472">scanner group in local</text>
  <text class="m" x="408" y="490">  Administrators</text>
  <text class="m" x="408" y="512">Remote Registry on</text>
  <text class="m" x="408" y="534">port 445 open to SCAN01</text>
  <text class="m" x="408" y="580">Wazuh agent 004</text>

  <!-- 1 scan signs in -->
  <path class="w" d="M175 178 L175 306 L470 306 L470 366" marker-end="url(#a)" />
  <circle class="step" cx="322" cy="306" r="12" /><text class="stept" x="322" y="310">1</text>
  <!-- 4 agent to siem -->
  <path class="w" d="M590 366 L590 182" marker-end="url(#a)" />
  <circle class="step" cx="590" cy="306" r="12" /><text class="stept" x="590" y="310">4</text>
  <!-- 2 check credential -->
  <path class="w" d="M390 452 L294 452" marker-end="url(#a)" />
  <circle class="step" cx="342" cy="452" r="12" /><text class="stept" x="342" y="456">2</text>
  <!-- 3 policy delivered -->
  <path class="w dash" d="M290 530 L386 530" marker-end="url(#a)" />
  <circle class="step" cx="338" cy="530" r="12" /><text class="stept" x="338" y="534">3</text>

  <g transform="translate(20 650)">
    <circle class="step" cx="12" cy="0" r="12" /><text class="stept" x="12" y="4">1</text><text class="leg" x="34" y="5">The scan signs in to WKS01 over SMB, port 445, crossing pfSense.</text>
    <circle class="step" cx="12" cy="34" r="12" /><text class="stept" x="12" y="38">2</text><text class="leg" x="34" y="39">WKS01 asks DC01 whether that login is genuine.</text>
    <circle class="step" cx="12" cy="68" r="12" /><text class="stept" x="12" y="72">3</text><text class="leg" x="34" y="73">DC01's policy has already put the scanner's group in WKS01's admins.</text>
    <circle class="step" cx="12" cy="102" r="12" /><text class="stept" x="12" y="106">4</text><text class="leg" x="34" y="107">The Wazuh agent on WKS01 reports every sign-in to SIEM01.</text>
  </g>
</svg>
