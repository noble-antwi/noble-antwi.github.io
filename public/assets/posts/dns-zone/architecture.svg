<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" role="img" aria-labelledby="t d">
  <title id="t">Where each piece of the DNS path lives</title>
  <desc id="d">The scanner SCAN01 on VLAN 20 asks its own local stub, which forwards to the pfSense resolver. pfSense answers public names by going out through its WAN interface to the internet, and answers the internal zone corp.biirabank.com by asking the domain controller DC01 on VLAN 50, because of a domain override. The workstation WKS01 on VLAN 50 registers its own name with DC01.</desc>

  <style>
    .bg { fill: #f7f8fa; }
    .zone { fill: #ffffff; stroke: #d5dae3; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .box { fill: #ffffff; stroke: #c3cad6; stroke-width: 1.3; }
    .box.fw { stroke: #0b6b63; stroke-width: 1.7; }
    .box.dc { stroke: #6d28d9; stroke-width: 1.7; }
    .box.soft { fill: #f2f4f8; stroke: #d5dae3; }
    .zl { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; fill: #5f646d; }
    .zl.v20 { fill: #0b6b63; }
    .zl.v50 { fill: #6d28d9; }
    .n { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #16181d; }
    .s { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; fill: #4a4f58; }
    .m { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #4a4f58; }
    .tag { fill: #eef6f5; stroke: #0b6b63; stroke-width: 1; }
    .tagt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; fill: #085650; }
    .w { fill: none; stroke: #6b7280; stroke-width: 1.8; }
    .w.pub { stroke: #1d4ed8; }
    .w.int { stroke: #6d28d9; }
    .w.reg { stroke: #9aa1ab; stroke-dasharray: 4 4; }
    .step { fill: #16181d; }
    .stept { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .lab { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; fill: #16181d; }
    .lab.pub { fill: #1d4ed8; }
    .lab.int { fill: #6d28d9; }
    .foot { font-family: Inter, system-ui, sans-serif; font-size: 13px; fill: #4a4f58; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b7280"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1d4ed8"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6d28d9"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#9aa1ab"/></marker>
  </defs>

  <rect class="bg" width="680" height="800" />

  <!-- VLAN 20: the scanner and its stub -->
  <rect class="zone" x="20" y="20" width="640" height="180" rx="14" />
  <text class="zl v20" x="40" y="46">VLAN 20 · BlueTeam</text>

  <rect class="box" x="40" y="64" width="240" height="112" rx="10" />
  <text class="n" x="58" y="94">SCAN01</text>
  <text class="s" x="58" y="116">Greenbone vulnerability scanner</text>
  <text class="m" x="58" y="142">192.168.20.3</text>

  <path class="w" d="M280 120 L376 120" marker-end="url(#a)" />
  <circle class="step" cx="326" cy="120" r="12" /><text class="stept" x="326" y="124">1</text>
  <text class="lab" x="292" y="160">asks locally</text>

  <rect class="box soft" x="378" y="64" width="262" height="112" rx="10" />
  <text class="n" x="396" y="94">systemd-resolved</text>
  <text class="s" x="396" y="116">the scanner's own local stub</text>
  <text class="m" x="396" y="140">127.0.0.53</text>
  <text class="s" x="396" y="162">forwards every question to pfSense</text>

  <!-- stub to pfSense -->
  <path class="w" d="M509 176 L509 250" marker-end="url(#a)" />
  <circle class="step" cx="509" cy="214" r="12" /><text class="stept" x="509" y="218">2</text>
  <text class="lab" x="530" y="219">port 53</text>

  <!-- pfSense -->
  <rect class="box fw" x="150" y="252" width="380" height="142" rx="12" />
  <text class="n" x="172" y="282">FW01 · pfSense DNS Resolver</text>
  <text class="s" x="172" y="304">Unbound, the lab's recursive resolver</text>
  <text class="m" x="172" y="328">192.168.20.1 on this segment</text>
  <rect class="tag" x="172" y="344" width="336" height="32" rx="7" />
  <text class="tagt" x="186" y="365">override: corp.biirabank.com → DC01</text>

  <!-- hop 3, two ways -->
  <path class="w pub" d="M240 394 L240 426 L170 426 L170 498" marker-end="url(#ap)" />
  <circle class="step" cx="205" cy="426" r="12" /><text class="stept" x="205" y="430">3</text>
  <text class="lab pub" x="26" y="452">public names</text>
  <text class="lab pub" x="26" y="470">out of WAN</text>

  <path class="w int" d="M440 394 L440 426 L500 426 L500 498" marker-end="url(#ai)" />
  <circle class="step" cx="470" cy="426" r="12" /><text class="stept" x="470" y="430">3</text>
  <text class="lab int" x="512" y="452">corp.biirabank.com</text>
  <text class="lab int" x="512" y="470">by the override</text>

  <!-- internet -->
  <rect class="zone" x="20" y="482" width="300" height="170" rx="14" />
  <text class="zl" x="40" y="512">Public internet</text>
  <rect class="box soft" x="40" y="526" width="260" height="104" rx="10" />
  <text class="n" x="58" y="556">Public DNS</text>
  <text class="s" x="58" y="580">biirabank.com is real and public,</text>
  <text class="s" x="58" y="600">and it has no corp subdomain</text>

  <!-- VLAN 50 -->
  <rect class="zone" x="340" y="482" width="320" height="258" rx="14" />
  <text class="zl v50" x="360" y="512">VLAN 50 · EnterpriseLAN</text>

  <rect class="box dc" x="360" y="526" width="280" height="98" rx="10" />
  <text class="n" x="378" y="556">DC01 · domain controller</text>
  <text class="s" x="378" y="578">authoritative for corp.biirabank.com</text>
  <text class="m" x="378" y="602">192.168.50.2</text>

  <rect class="box" x="360" y="648" width="280" height="72" rx="10" />
  <text class="n" x="378" y="678">WKS01 · workstation</text>
  <text class="s" x="378" y="700">DHCP · registers its own name</text>
  <path class="w reg" d="M500 648 L500 628" marker-end="url(#ag)" />

  <text class="foot" x="20" y="770">A question from the scanner makes up to three hops. Hop 3 goes one of two</text>
  <text class="foot" x="20" y="790">ways, and the override on pfSense decides which. This story follows the purple one.</text>
</svg>
