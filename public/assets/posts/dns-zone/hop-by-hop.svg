<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-labelledby="t d">
  <title id="t">Asking each hop in turn</title>
  <desc id="d">Hop 1, the scanner's local stub, timed out for every name until it was restarted. Hop 2, the pfSense resolver, answered a public name in 48 milliseconds but returned SERVFAIL for the internal name in 0 milliseconds from cache. Hop 3, the domain controller, answered the internal name authoritatively in 2 milliseconds. The answer changes between hop 2 and hop 3, so the fault is how pfSense reaches the domain controller.</desc>

  <style>
    .bg { fill: #f7f8fa; }
    .row { fill: #ffffff; stroke: #d5dae3; stroke-width: 1.2; }
    .hop { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; fill: #5f646d; }
    .n { font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #16181d; }
    .s { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; fill: #4a4f58; }
    .cmd { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #16181d; }
    .cmdbg { fill: #f2f4f8; }
    .ok { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #15803d; }
    .bad { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #b91c1c; }
    .note { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; fill: #5f646d; font-style: italic; }
    .flag { fill: #fff4f2; stroke: #b91c1c; stroke-width: 1.2; }
    .flagt { font-family: Inter, system-ui, sans-serif; font-size: 13.5px; fill: #7f1d1d; }
    .rail { stroke: #c3cad6; stroke-width: 2; }
  </style>

  <rect class="bg" width="680" height="700" />
  <line class="rail" x1="26" y1="40" x2="26" y2="540" />

  <!-- hop 1 -->
  <circle cx="26" cy="90" r="8" fill="#b91c1c" />
  <rect class="row" x="46" y="20" width="614" height="150" rx="10" />
  <text class="hop" x="66" y="46">Hop 1 · on the scanner</text>
  <text class="n" x="66" y="70">systemd-resolved, 127.0.0.53</text>
  <text class="s" x="66" y="90">the local stub every program on SCAN01 asks first</text>
  <rect class="cmdbg" x="66" y="104" width="360" height="28" rx="5" />
  <text class="cmd" x="78" y="123">dig wks01.corp.biirabank.com</text>
  <text class="bad" x="440" y="123">timed out</text>
  <text class="note" x="66" y="156">Every name failed, not just this one. A restart cleared a cached dead state.</text>

  <!-- hop 2 -->
  <circle cx="26" cy="264" r="8" fill="#b91c1c" />
  <rect class="row" x="46" y="186" width="614" height="186" rx="10" />
  <text class="hop" x="66" y="212">Hop 2 · on the firewall</text>
  <text class="n" x="66" y="236">pfSense resolver, 192.168.20.1</text>
  <text class="s" x="66" y="256">the lab's recursive resolver</text>
  <rect class="cmdbg" x="66" y="270" width="360" height="28" rx="5" />
  <text class="cmd" x="78" y="289">dig @192.168.20.1 google.com</text>
  <text class="ok" x="440" y="289">NOERROR · 48 ms</text>
  <rect class="cmdbg" x="66" y="306" width="360" height="28" rx="5" />
  <text class="cmd" x="78" y="325">dig … wks01.corp.biirabank.com</text>
  <text class="bad" x="440" y="325">SERVFAIL · 0 ms</text>
  <text class="note" x="66" y="358">Healthy for the internet. Failing, instantly, for the one internal zone.</text>

  <!-- hop 3 -->
  <circle cx="26" cy="456" r="8" fill="#15803d" />
  <rect class="row" x="46" y="388" width="614" height="150" rx="10" />
  <text class="hop" x="66" y="414">Hop 3 · on the domain controller</text>
  <text class="n" x="66" y="438">DC01, 192.168.50.2</text>
  <text class="s" x="66" y="458">owns corp.biirabank.com</text>
  <rect class="cmdbg" x="66" y="472" width="360" height="28" rx="5" />
  <text class="cmd" x="78" y="491">dig @192.168.50.2 wks01.corp…</text>
  <text class="ok" x="440" y="491">NOERROR · aa · 2 ms</text>
  <text class="note" x="66" y="524">The record exists, DC01 serves it, and VLAN 20 reaches VLAN 50 on port 53.</text>

  <!-- verdict -->
  <rect class="flag" x="46" y="556" width="614" height="124" rx="10" />
  <text class="flagt" x="68" y="586" font-weight="700">The answer changes between hop 2 and hop 3.</text>
  <text class="flagt" x="68" y="610">DC01 answers the scanner directly, but pfSense cannot</text>
  <text class="flagt" x="68" y="630">get the same answer from it. So the fault is not the record</text>
  <text class="flagt" x="68" y="650">and not the firewall rules. It is how pfSense itself</text>
  <text class="flagt" x="68" y="670">reaches DC01.</text>
</svg>
