<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" aria-labelledby="t d">
  <title id="t">Where the query went, before and after the fix</title>
  <desc id="d">Before: the resolver on pfSense could send queries out of the WAN interface only, so public names were answered and queries for the internal zone were never sent, returning SERVFAIL. After: the internal interface is added, so the query for the internal zone reaches the domain controller and is answered.</desc>

  <style>
    .bg { fill: #f7f8fa; }
    .panel { fill: #ffffff; stroke: #d5dae3; stroke-width: 1.2; }
    .box { fill: #ffffff; stroke: #c3cad6; stroke-width: 1.3; }
    .box.fw { stroke: #0b6b63; stroke-width: 1.7; }
    .box.good { stroke: #15803d; stroke-width: 1.5; }
    .box.dc { stroke: #6d28d9; stroke-width: 1.7; }
    .box.dead { stroke: #b91c1c; stroke-dasharray: 5 4; stroke-width: 1.5; }
    .k { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
    .k.before { fill: #b91c1c; }
    .k.after { fill: #15803d; }
    .n { font-family: Inter, system-ui, sans-serif; font-size: 14.5px; font-weight: 600; fill: #16181d; }
    .s { font-family: Inter, system-ui, sans-serif; font-size: 12.5px; fill: #4a4f58; }
    .m { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #4a4f58; }
    .m.bad { fill: #b91c1c; font-weight: 700; }
    .m.good { fill: #15803d; font-weight: 700; }
    .w { fill: none; stroke: #6b7280; stroke-width: 1.8; }
    .w.ok { stroke: #15803d; }
    .w.int { stroke: #6d28d9; }
    .w.dead { stroke: #b91c1c; stroke-dasharray: 5 4; }
    .x { stroke: #b91c1c; stroke-width: 2.2; stroke-linecap: round; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6b7280"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#15803d"/></marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6d28d9"/></marker>
  </defs>

  <rect class="bg" width="680" height="720" />

  <!-- ============================== BEFORE ============================== -->
  <rect class="panel" x="20" y="20" width="640" height="330" rx="12" />
  <text class="k before" x="40" y="48">Before · outgoing interfaces: WAN only</text>

  <rect class="box" x="40" y="66" width="190" height="64" rx="8" />
  <text class="n" x="56" y="93">SCAN01</text>
  <text class="s" x="56" y="114">the scanner, VLAN 20</text>
  <path class="w" d="M230 98 L276 98" marker-end="url(#a)" />

  <rect class="box fw" x="278" y="62" width="362" height="92" rx="8" />
  <text class="n" x="296" y="88">pfSense resolver</text>
  <text class="s" x="296" y="108">may send its own questions out of:</text>
  <text class="m" x="296" y="130">WAN</text>
  <text class="m bad" x="360" y="130">internal interfaces: none</text>

  <path class="w ok" d="M360 154 L180 196" marker-end="url(#ag)" />
  <path class="w dead" d="M560 154 L500 192" />

  <rect class="box good" x="40" y="198" width="280" height="72" rx="8" />
  <text class="m good" x="56" y="222">public names</text>
  <text class="n" x="56" y="244">Internet · answered</text>
  <text class="s" x="56" y="262">every public lookup works</text>

  <rect class="box dead" x="340" y="198" width="300" height="72" rx="8" />
  <text class="m bad" x="356" y="222">corp.biirabank.com</text>
  <text class="n" x="356" y="244">DC01 · never asked</text>
  <text class="s" x="356" y="262">no refusal, nothing in any log</text>
  <line class="x" x1="610" y1="212" x2="626" y2="228" />
  <line class="x" x1="626" y1="212" x2="610" y2="228" />

  <text class="m bad" x="40" y="304">it waits, gives up, returns SERVFAIL, and caches it</text>
  <text class="s" x="40" y="326">so the retry fails instantly, which is its own clue</text>

  <!-- ============================== AFTER =============================== -->
  <rect class="panel" x="20" y="370" width="640" height="330" rx="12" />
  <text class="k after" x="40" y="398">After · WAN plus the internal interface</text>

  <rect class="box" x="40" y="416" width="190" height="64" rx="8" />
  <text class="n" x="56" y="443">SCAN01</text>
  <text class="s" x="56" y="464">the scanner, VLAN 20</text>
  <path class="w" d="M230 448 L276 448" marker-end="url(#a)" />

  <rect class="box fw" x="278" y="412" width="362" height="92" rx="8" />
  <text class="n" x="296" y="438">pfSense resolver</text>
  <text class="s" x="296" y="458">may send its own questions out of:</text>
  <text class="m" x="296" y="480">WAN</text>
  <text class="m good" x="360" y="480">the interface facing DC01</text>

  <path class="w ok" d="M360 504 L180 546" marker-end="url(#ag)" />
  <path class="w int" d="M560 504 L500 544" marker-end="url(#ai)" />

  <rect class="box good" x="40" y="548" width="280" height="72" rx="8" />
  <text class="m good" x="56" y="572">public names</text>
  <text class="n" x="56" y="594">Internet · answered</text>
  <text class="s" x="56" y="612">unchanged</text>

  <rect class="box dc" x="340" y="548" width="300" height="72" rx="8" />
  <text class="m" x="356" y="572" fill="#6d28d9">corp.biirabank.com</text>
  <text class="n" x="356" y="594">DC01 · answered</text>
  <text class="s" x="356" y="612">authoritative, 2 ms</text>

  <text class="m good" x="40" y="654">NOERROR · 390 ms the first time, 1 ms from cache</text>
  <text class="s" x="40" y="676">the scanner can now target the workstation by name</text>
</svg>
