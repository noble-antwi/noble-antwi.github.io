</defs><rect width="1200" height="760" rx="18" fill="#060D1F"/><rect width="1200" height="760" rx="18" fill="url(#grid)"/><g transform="translate(52 52)"><path d="M0 -26 L20 -17 V4 Q20 16 0 26 Q-20 16 -20 4 V-17 Z" fill="#08152F" stroke="#2DD4E8" stroke-width="2.5" filter="url(#glowC)"/><circle r="12" fill="none" stroke="#2DD4E8" stroke-width="1" opacity="0.5"/><circle r="4" fill="#2DD4E8"/><g class="anim" style="animation:sweep 6s linear infinite;transform-origin:0px 0px"><path d="M0 0 L-7 -16 A17 17 0 0 1 7 -16 Z" fill="#2DD4E8" opacity="0.45"/></g></g><text class="t" x="96" y="44" font-size="24" font-weight="700" style="fill:#F4FAFD">Two locks on one VM: managing it, and logging in to it</text><text class="t" x="96" y="74" font-size="14" style="fill:#9BE8F2">azure-labs &#183; lab 04 custom RBAC role &#183; a least-privilege operator, tested on both planes</text><rect x="0" y="96" width="1200" height="2" fill="#2DD4E8" opacity="0.9"/><rect x="36" y="124" width="250" height="470" rx="16" fill="#0A1830" stroke="#1C3050"/><circle cx="80" cy="172" r="22" fill="#08152F" stroke="#2DD4E8" stroke-width="2"/><circle cx="80" cy="166" r="7" fill="#2DD4E8"/><path d="M68 184 q12 -12 24 0" fill="#2DD4E8"/><text class="t" x="114" y="168" font-size="16" font-weight="800" style="fill:#F4FAFD">lab-vmop</text><text class="t" x="114" y="188" font-size="11.5" style="fill:#8FA3BF">test user &#183; MFA on</text><text class="t" x="56" y="236" font-size="11.5" font-weight="700" letter-spacing="1.1" style="fill:#8FA3BF">ROLES ON rg-lab-vm</text><rect x="54" y="250" width="214" height="62" rx="10" fill="#08152F" stroke="#2DD4E8" stroke-width="1.3"/><text class="t" x="68" y="276" font-size="13.5" font-weight="800" style="fill:#2DD4E8">Lab VM Operator</text><text class="t" x="68" y="297" font-size="11" style="fill:#8FA3BF">custom &#183; 5 actions &#183; management</text><g class="anim w1"><rect x="54" y="326" width="214" height="62" rx="10" fill="#1E1640" stroke="#A78BFA" stroke-width="1.3"/><text class="t" x="68" y="352" font-size="13.5" font-weight="800" style="fill:#A78BFA">VM User Login</text><text class="t" x="68" y="373" font-size="11" style="fill:#8FA3BF">built-in &#183; 1 data action</text></g><g class="anim w2"><rect x="54" y="326" width="214" height="62" rx="10" fill="none" stroke="#3A4B66" stroke-dasharray="5 5"/><text class="t" x="161.0" y="362" font-size="11.5" text-anchor="middle" style="fill:#8FA3BF">no login role yet</text></g><g class="anim w3"><text class="t" x="161.0" y="414" font-size="12.5" font-weight="700" text-anchor="middle" style="fill:#A78BFA">+ role added by the admin</text></g><text class="t" x="56" y="454" font-size="11" style="fill:#8FA3BF">not given:</text><text class="t" x="56" y="474" font-size="11.5" style="fill:#8FA3BF">&#215; delete, write, resize</text><text class="t" x="56" y="494" font-size="11.5" style="fill:#8FA3BF">&#215; read NIC / IP / VNet</text><text class="t" x="56" y="514" font-size="11.5" style="fill:#8FA3BF">&#215; Administrator Login (sudo)</text><text class="t" x="310" y="152" font-size="11.5" font-weight="700" letter-spacing="1.1" style="fill:#2DD4E8">MANAGEMENT PLANE &#183; Azure Resource Manager</text><line x1="286" y1="250" x2="880" y2="250" stroke="#1C3050" stroke-width="2" stroke-dasharray="2 6"/><text class="t" x="310" y="378" font-size="11.5" font-weight="700" letter-spacing="1.1" style="fill:#A78BFA">DATA PLANE &#183; inside the VM</text><line x1="286" y1="476" x2="880" y2="476" stroke="#1C3050" stroke-width="2" stroke-dasharray="2 6"/><rect x="520" y="168" width="270" height="164" rx="14" fill="#0A1830" stroke="#2DD4E8" stroke-width="1.4"/><text class="t" x="538" y="194" font-size="13" font-weight="800" style="fill:#F4FAFD">Is the action in the role?</text><text class="t m" x="538" y="218" font-size="11.5" style="fill:#2BD99F">&#10003; virtualMachines/read</text><text class="t m" x="538" y="236" font-size="11.5" style="fill:#2BD99F">&#10003; start/action</text><text class="t m" x="538" y="254" font-size="11.5" style="fill:#2BD99F">&#10003; deallocate/action</text><text class="t m" x="538" y="272" font-size="11.5" style="fill:#2BD99F">&#10003; restart/action</text><text class="t m" x="538" y="290" font-size="11.5" style="fill:#2BD99F">&#10003; powerOff/action</text><text class="t m" x="538" y="308" font-size="11.5" style="fill:#FF6B5E">&#215; delete</text><rect x="520" y="402" width="270" height="148" rx="14" fill="#0A1830" stroke="#A78BFA" stroke-width="1.4"/><text class="t" x="538" y="428" font-size="13" font-weight="800" style="fill:#F4FAFD">Entra login check</text><text class="t" x="538" y="449" font-size="11.5" style="fill:#8FA3BF">VM identity + AADSSHLoginForLinux</text><text class="t m" x="538" y="473" font-size="11.5" style="fill:#D6EEF4">shell needs  login/action</text><text class="t m" x="538" y="493" font-size="11.5" style="fill:#D6EEF4">sudo  needs  adminLogin/action</text><rect x="880" y="168" width="286" height="382" rx="16" fill="#0A1830" stroke="#1C3050"/><text class="t" x="900" y="200" font-size="17" font-weight="800" style="fill:#F4FAFD">vm-lab-01</text><text class="t" x="900" y="222" font-size="11.5" style="fill:#8FA3BF">rg-lab-vm &#183; Ubuntu 24.04</text><g class="anim w4"><text class="t" x="900" y="256" font-size="13" font-weight="700" style="fill:#8FA3BF">&#9679; deallocated</text></g><g class="anim w5"><text class="t" x="900" y="256" font-size="13" font-weight="700" style="fill:#2BD99F">&#9679; running</text></g><g class="anim w6"><text class="t" x="900" y="280" font-size="12" style="fill:#2BD99F">still here: 7 of 7 resources</text></g><rect x="898" y="422" width="250" height="118" rx="10" fill="#03081A" stroke="#3A4B66"/><g class="anim w7"><text class="t m" x="912" y="452" font-size="12" style="fill:#8FA3BF">no session</text></g><g class="anim w8"><text class="t m" x="912" y="452" font-size="12" style="fill:#2BD99F">lab-vmop@vm-lab-01:~$</text></g><g class="anim w9"><text class="t m" x="912" y="476" font-size="12" style="fill:#D6EEF4">$ sudo whoami</text><text class="t m" x="912" y="498" font-size="12" style="fill:#FF6B5E">not in the sudoers file</text></g><g class="anim mv10"><rect x="306" y="233" width="120" height="34" rx="17" fill="#F4FAFD" filter="url(#glowC)"/><text class="t" x="366" y="255" font-size="13" font-weight="800" text-anchor="middle" style="fill:#08152F">Start</text></g><g class="anim w11"><rect x="515.0" y="338" width="280" height="34" rx="10" fill="#0F3B31" stroke="#2BD99F" stroke-width="1.3"/><text class="t m" x="655.0" y="360" font-size="12" font-weight="700" text-anchor="middle" style="fill:#2BD99F">allowed</text></g><g class="anim mv12"><rect x="306" y="233" width="120" height="34" rx="17" fill="#F4FAFD" filter="url(#glowC)"/><text class="t" x="366" y="255" font-size="13" font-weight="800" text-anchor="middle" style="fill:#08152F">Delete</text></g><g class="anim w13"><rect x="515.0" y="338" width="280" height="34" rx="10" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.3"/><text class="t m" x="655.0" y="360" font-size="12" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">403: no virtualMachines/delete</text></g><g class="anim mv14"><rect x="306" y="459" width="120" height="34" rx="17" fill="#F4FAFD" filter="url(#glowC)"/><text class="t" x="366" y="481" font-size="13" font-weight="800" text-anchor="middle" style="fill:#08152F">az ssh vm</text></g><g class="anim w15"><rect x="515.0" y="560" width="280" height="34" rx="10" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.3"/><text class="t m" x="655.0" y="582" font-size="12" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">Permission denied (publickey)</text></g><g class="anim mv16"><rect x="306" y="459" width="120" height="34" rx="17" fill="#F4FAFD" filter="url(#glowC)"/><text class="t" x="366" y="481" font-size="13" font-weight="800" text-anchor="middle" style="fill:#08152F">az ssh vm</text></g><g class="anim w17"><rect x="515.0" y="560" width="280" height="34" rx="10" fill="#0F3B31" stroke="#2BD99F" stroke-width="1.3"/><text class="t m" x="655.0" y="582" font-size="12" font-weight="700" text-anchor="middle" style="fill:#2BD99F">allowed</text></g><g class="anim mv18"><rect x="306" y="459" width="120" height="34" rx="17" fill="#F4FAFD" filter="url(#glowC)"/><text class="t" x="366" y="481" font-size="13" font-weight="800" text-anchor="middle" style="fill:#08152F">sudo whoami</text></g><g class="anim w19"><rect x="515.0" y="560" width="280" height="34" rx="10" fill="#3A1620" stroke="#FF6B5E" stroke-width="1.3"/><text class="t m" x="655.0" y="582" font-size="12" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">denied: no adminLogin/action</text></g><rect x="24" y="620" width="1152" height="52" rx="12" fill="#0A1830" stroke="#1C3050"/><text class="anim w20 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#2BD99F">Start:</tspan> start/action is in the role, so Azure runs it.</text><text class="anim w21 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#FF6B5E">Delete:</tspan> the portal shows the button, but Azure refuses: delete is not in the role.</text><text class="anim w22 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#FF6B5E">SSH with Entra:</tspan> the custom role is management plane only; logging in is a data action.</text><text class="anim w23 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#A78BFA">Admin adds Virtual Machine User Login</tspan> on rg-lab-vm: one data action, login/action.</text><text class="anim w24 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#2BD99F">SSH again:</tspan> Entra signs a short-lived certificate, the VM checks the role, the shell opens. No key file.</text><text class="anim w25 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#FF6B5E">sudo:</tspan> User Login is a shell, not root. Administrator Login would add sudo.</text><text class="t" x="600.0" y="710" font-size="13" text-anchor="middle" style="fill:#D6EEF4"><tspan font-weight="700" style="fill:#FFC04D">Read the actions list, not the role name.</tspan> A role that can delete a VM cannot log in to it, and one that can log in cannot delete it.</text><text class="t" x="600.0" y="734" font-size="11.5" text-anchor="middle" style="fill:#8FA3BF">Assignable scope: the subscription (where the role may be given). Assignment scope: rg-lab-vm (where it is given).</text></svg>