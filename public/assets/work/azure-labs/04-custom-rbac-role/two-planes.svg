<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="A test user with a custom VM operator role starts a VM (allowed) and tries to delete it (denied by Azure Resource Manager). Entra SSH is denied until Virtual Machine User Login is added, then allowed; sudo is denied because User Login is not Administrator Login."><title>Two locks on one VM: managing it, and logging in to it</title><style>
