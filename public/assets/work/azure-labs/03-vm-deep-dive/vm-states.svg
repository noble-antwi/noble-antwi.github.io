</defs><rect width="1200" height="760" rx="18" fill="#060D1F"/><rect width="1200" height="760" rx="18" fill="url(#grid)"/><g transform="translate(52 52)"><path d="M0 -26 L20 -17 V4 Q20 16 0 26 Q-20 16 -20 4 V-17 Z" fill="#08152F" stroke="#2DD4E8" stroke-width="2.5" filter="url(#glowC)"/><circle r="12" fill="none" stroke="#2DD4E8" stroke-width="1" opacity="0.5"/><circle r="4" fill="#2DD4E8"/><g class="anim" style="animation:sweep 6s linear infinite;transform-origin:0px 0px"><path d="M0 0 L-7 -16 A17 17 0 0 1 7 -16 Z" fill="#2DD4E8" opacity="0.45"/></g></g><text class="t" x="96" y="44" font-size="24" font-weight="700" style="fill:#F4FAFD">Turning a VM off: what keeps billing, what survives</text><text class="t" x="96" y="74" font-size="14" style="fill:#9BE8F2">azure-labs &#183; lab 03 VM deep dive &#183; only Azure can stop the compute bill</text><rect x="0" y="96" width="1200" height="2" fill="#2DD4E8" opacity="0.9"/><rect x="40" y="118" width="260" height="54" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><g class="anim w1"><rect x="40" y="118" width="260" height="54" rx="12" fill="#08152F" stroke="#2BD99F" stroke-width="2.2"/></g><text class="t" x="170.0" y="151" font-size="14" font-weight="800" letter-spacing="1.2" text-anchor="middle" style="fill:#2BD99F">RUNNING</text><rect x="320" y="118" width="260" height="54" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><g class="anim w2"><rect x="320" y="118" width="260" height="54" rx="12" fill="#08152F" stroke="#FFC04D" stroke-width="2.2"/></g><text class="t" x="450.0" y="142" font-size="14" font-weight="800" letter-spacing="1.2" text-anchor="middle" style="fill:#FFC04D">STOPPED</text><text class="t m" x="450.0" y="161" font-size="11" text-anchor="middle" style="fill:#8FA3BF">shutdown -h inside Ubuntu</text><rect x="600" y="118" width="280" height="54" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><g class="anim w3"><rect x="600" y="118" width="280" height="54" rx="12" fill="#08152F" stroke="#FF6B5E" stroke-width="2.2"/></g><text class="t" x="740.0" y="142" font-size="14" font-weight="800" letter-spacing="1.2" text-anchor="middle" style="fill:#FF6B5E">STOPPED (DEALLOCATED)</text><text class="t m" x="740.0" y="161" font-size="11" text-anchor="middle" style="fill:#8FA3BF">portal Stop / az vm deallocate</text><rect x="900" y="118" width="260" height="54" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><g class="anim w4"><rect x="900" y="118" width="260" height="54" rx="12" fill="#08152F" stroke="#2BD99F" stroke-width="2.2"/></g><text class="t" x="1030.0" y="142" font-size="14" font-weight="800" letter-spacing="1.2" text-anchor="middle" style="fill:#2BD99F">RUNNING AGAIN</text><text class="t m" x="1030.0" y="161" font-size="11" text-anchor="middle" style="fill:#8FA3BF">Start: a new host</text><path d="M304 145 h10 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8FA3BF" stroke-width="1.6"/><path d="M584 145 h10 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8FA3BF" stroke-width="1.6"/><path d="M884 145 h10 m-5 -5 l5 5 l-5 5" fill="none" stroke="#8FA3BF" stroke-width="1.6"/><rect x="40" y="200" width="520" height="390" rx="16" fill="none" stroke="#8FA3BF" stroke-width="1.5" stroke-dasharray="7 6"/><text class="t" x="60" y="228" font-size="12" font-weight="700" letter-spacing="1.2" style="fill:#8FA3BF">PHYSICAL SERVER IN THE DATACENTRE</text><text class="anim w5 t m" x="540" y="228" font-size="12" text-anchor="end" style="fill:#9BE8F2">host A</text><text class="anim w6 t m" x="540" y="228" font-size="12" font-weight="700" text-anchor="end" style="fill:#FF6B5E">handed back to Azure</text><text class="anim w7 t m" x="540" y="228" font-size="12" text-anchor="end" style="fill:#2BD99F">host B</text><g class="anim w8"><rect x="64" y="250" width="472" height="150" rx="14" fill="#0A1830" stroke="#2DD4E8" stroke-width="1.4"/><text class="t" x="86" y="286" font-size="18" font-weight="800" style="fill:#F4FAFD">vm-lab-01</text><text class="t" x="86" y="310" font-size="12.5" style="fill:#9BE8F2">Standard_D2s_v3 &#183; 2 vCPU &#183; 8 GiB &#183; Ubuntu 24.04</text><text class="t" x="86" y="342" font-size="12" font-weight="700" letter-spacing="1" style="fill:#8FA3BF">COMPUTE</text></g><g class="anim w9"><text class="t" x="86" y="374" font-size="13" font-weight="600" style="fill:#2BD99F">&#9679; Ubuntu running</text></g><g class="anim w10"><text class="t" x="86" y="374" font-size="13" font-weight="600" style="fill:#FFC04D">&#9679; Ubuntu halted, but the server is still reserved</text></g><g class="anim w11"><rect x="418" y="354" width="96" height="26" rx="13" fill="#3A2C10" stroke="#FFC04D" stroke-width="1.2"/><circle cx="434" cy="367" r="4.5" fill="#FFC04D" style="animation:blink 1.2s ease-in-out infinite"/><text class="t" x="474" y="371.5" font-size="12" font-weight="700" text-anchor="middle" style="fill:#FFC04D">billing</text></g><g class="anim w12"><rect x="64" y="250" width="472" height="150" rx="14" fill="none" stroke="#3A4B66" stroke-width="1.4" stroke-dasharray="5 6"/><text class="t" x="300.0" y="320" font-size="15" font-weight="700" text-anchor="middle" style="fill:#8FA3BF">no VM here: CPU and RAM released</text><text class="t" x="300.0" y="344" font-size="12.5" text-anchor="middle" style="fill:#8FA3BF">compute stops billing</text></g><g class="anim w13"><rect x="418" y="354" width="96" height="26" rx="13" fill="#0A1830" stroke="#3A4B66" stroke-width="1.2"/><text class="t" x="466" y="371.5" font-size="12" font-weight="700" text-anchor="middle" style="fill:#8FA3BF">free</text></g><rect x="64" y="422" width="472" height="130" rx="14" fill="#0A1830" stroke="#A78BFA" stroke-width="1.4"/><text class="t" x="86" y="454" font-size="15" font-weight="800" style="fill:#A78BFA">Temporary disk &#183; 16 GiB &#183; /mnt</text><text class="t" x="86" y="476" font-size="12" style="fill:#8FA3BF">part of this server; included in the size price</text><g class="anim w14"><rect x="86" y="494" width="210" height="36" rx="9" fill="#F4FAFD"/><text class="t m" x="191" y="517" font-size="13" font-weight="700" text-anchor="middle" style="fill:#08152F">/mnt/proof.txt</text></g><g class="anim w15"><rect x="86" y="494" width="210" height="36" rx="9" fill="#3A1620" stroke="#FF6B5E"/><text class="t" x="191" y="517" font-size="13" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">wiped</text></g><g class="anim w16"><rect x="86" y="494" width="210" height="36" rx="9" fill="none" stroke="#3A4B66" stroke-dasharray="4 5"/><text class="t m" x="191" y="517" font-size="12" text-anchor="middle" style="fill:#8FA3BF">empty: No such file</text></g><text class="t" x="600" y="228" font-size="12" font-weight="700" letter-spacing="1.2" style="fill:#8FA3BF">SEPARATE RESOURCES: THEY STAY WHEN THE SERVER GOES</text><rect x="600" y="246" width="560" height="96" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><text class="t" x="620" y="276" font-size="15" font-weight="800" style="fill:#F4FAFD">OS disk</text><text class="t" x="620" y="298" font-size="12" style="fill:#9BE8F2">30 GiB managed disk, stored apart from the server</text><g class=""><rect x="1044" y="260" width="96" height="26" rx="13" fill="#3A2C10" stroke="#FFC04D" stroke-width="1.2"/><circle cx="1060" cy="273" r="4.5" fill="#FFC04D" style="animation:blink 1.2s ease-in-out infinite"/><text class="t" x="1100" y="277.5" font-size="12" font-weight="700" text-anchor="middle" style="fill:#FFC04D">billing</text></g><rect x="620" y="308" width="190" height="26" rx="7" fill="#F4FAFD"/><text class="t m" x="715" y="326" font-size="12.5" font-weight="700" text-anchor="middle" style="fill:#08152F">/opt/proof.txt</text><text class="anim w17 t" x="824" y="326" font-size="12.5" font-weight="700" style="fill:#2BD99F">&#10003; still here after deallocate</text><rect x="600" y="354" width="560" height="72" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><text class="t" x="620" y="384" font-size="15" font-weight="800" style="fill:#F4FAFD">Public IP</text><text class="t" x="620" y="406" font-size="12" style="fill:#9BE8F2">Standard, static: the address is held for you</text><g class=""><rect x="1044" y="368" width="96" height="26" rx="13" fill="#3A2C10" stroke="#FFC04D" stroke-width="1.2"/><circle cx="1060" cy="381" r="4.5" fill="#FFC04D" style="animation:blink 1.2s ease-in-out infinite"/><text class="t" x="1100" y="385.5" font-size="12" font-weight="700" text-anchor="middle" style="fill:#FFC04D">billing</text></g><text class="anim w18 t" x="1030" y="412" font-size="12" font-weight="700" text-anchor="end" style="fill:#2BD99F">&#10003; same address</text><rect x="600" y="438" width="560" height="72" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><text class="t" x="620" y="468" font-size="15" font-weight="800" style="fill:#F4FAFD">NIC</text><text class="t" x="620" y="490" font-size="12" style="fill:#9BE8F2">owns the private IP 10.30.0.4</text><g class=""><rect x="1044" y="452" width="96" height="26" rx="13" fill="#0A1830" stroke="#3A4B66" stroke-width="1.2"/><text class="t" x="1092" y="469.5" font-size="12" font-weight="700" text-anchor="middle" style="fill:#8FA3BF">free</text></g><text class="anim w19 t" x="1030" y="496" font-size="12" font-weight="700" text-anchor="end" style="fill:#2BD99F">&#10003; same address</text><rect x="600" y="522" width="560" height="72" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><text class="t" x="620" y="552" font-size="15" font-weight="800" style="fill:#F4FAFD">NSG</text><text class="t" x="620" y="574" font-size="12" style="fill:#9BE8F2">allow 22 from one IP; deny the rest</text><g class=""><rect x="1044" y="536" width="96" height="26" rx="13" fill="#0A1830" stroke="#3A4B66" stroke-width="1.2"/><text class="t" x="1092" y="553.5" font-size="12" font-weight="700" text-anchor="middle" style="fill:#8FA3BF">free</text></g><rect x="24" y="628" width="1152" height="52" rx="12" fill="#0A1830" stroke="#1C3050" stroke-width="1"/><text class="anim w20 t" x="44" y="660" font-size="14.5"><tspan font-weight="800" style="fill:#2BD99F">Running.</tspan> Compute, the OS disk and the public IP all bill.</text><text class="anim w21 t" x="44" y="660" font-size="14.5"><tspan font-weight="800" style="fill:#FFC04D">Status: Stopped.</tspan> Ubuntu halted, but Azure was never told. The server is still yours, so compute still bills.</text><text class="anim w22 t" x="44" y="660" font-size="14.5"><tspan font-weight="800" style="fill:#FF6B5E">Status: Stopped (deallocated).</tspan> Server handed back. Compute stops billing; /mnt is wiped. Disk and IP keep billing.</text><text class="anim w23 t" x="44" y="660" font-size="14.5"><tspan font-weight="800" style="fill:#2BD99F">Started on a new server.</tspan> Same OS disk, same IPs. The temp disk comes back empty.</text><text class="t" x="600.0" y="716" font-size="13" text-anchor="middle" style="fill:#D6EEF4"><tspan font-weight="700" style="fill:#FFC04D">A stopped VM is not a free VM</tspan> until Azure says <tspan class="m" style="fill:#FF6B5E">deallocated</tspan>.</text><text class="t" x="600.0" y="738" font-size="11.5" text-anchor="middle" style="fill:#8FA3BF">Only Azure can deallocate: the portal Stop button, az vm deallocate, or the auto-shutdown schedule.</text></svg>