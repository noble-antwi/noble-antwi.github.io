fill:#8FA3BF">...#EXT#@ &#183; PendingAcceptance</text><g class="anim w18"><rect x="532" y="559" width="50" height="22" rx="11" fill="#3A1620" stroke="#FF6B5E"/><text class="t" x="557" y="574" font-size="10.5" font-weight="700" text-anchor="middle" style="fill:#FF6B5E">none</text></g><rect x="812" y="118" width="360" height="300" rx="16" fill="none" stroke="#2DD4E8" stroke-width="1.6" stroke-dasharray="6 6"/><text class="t" x="830" y="144" font-size="12" font-weight="700" letter-spacing="1.1" style="fill:#2DD4E8">AZURE &#183; sub-noble-seclab-001</text><rect x="830" y="162" width="324" height="238" rx="12" fill="#0A1830" stroke="#1C3050"/><text class="t" x="848" y="192" font-size="16" font-weight="800" style="fill:#F4FAFD">rg-lab-vm</text><text class="t" x="848" y="212" font-size="11.5" style="fill:#8FA3BF">VM, disk, IP, VNet from lab 03</text><text class="t" x="848" y="248" font-size="11.5" font-weight="700" letter-spacing="1" style="fill:#8FA3BF">ACCESS CONTROL (IAM)</text><g class="anim w19"><rect x="848" y="260" width="288" height="58" rx="10" fill="none" stroke="#3A4B66" stroke-dasharray="5 5"/><text class="t" x="992.0" y="294" font-size="12" text-anchor="middle" style="fill:#8FA3BF">no group assignment yet</text></g><g class="anim w20"><rect x="848" y="260" width="288" height="58" rx="10" fill="#0F3B31" stroke="#2BD99F" stroke-width="1.4"/><text class="t" x="864" y="285" font-size="14" font-weight="800" style="fill:#2BD99F">Reader</text><text class="t" x="864" y="306" font-size="11.5" style="fill:#D6EEF4">assigned to: L5-All-Staff (group)</text></g><g class="anim w21"><text class="t" x="848" y="344" font-size="11.5" style="fill:#8FA3BF">one assignment, not eight</text></g><g class="anim w22"><path d="M848 289 C 772 289, 666 184, 610 184" fill="none" stroke="#2BD99F" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrG)"/></g><g class="anim w23"><rect x="812" y="436" width="360" height="150" rx="14" fill="#0A1830" stroke="#2DD4E8" stroke-width="1.4"/><text class="t" x="830" y="464" font-size="13" font-weight="800" style="fill:#F4FAFD">Check access: Kofi Boateng</text><text class="t" x="830" y="494" font-size="12" style="fill:#8FA3BF">Role</text><text class="t m" x="932" y="494" font-size="12" font-weight="700" style="fill:#2BD99F">Reader</text><text class="t" x="830" y="516" font-size="12" style="fill:#8FA3BF">Resource</text><text class="t m" x="932" y="516" font-size="12" font-weight="700" style="fill:#D6EEF4">rg-lab-vm</text><text class="t" x="830" y="538" font-size="12" style="fill:#8FA3BF">Assigned to</text><text class="t m" x="932" y="538" font-size="12" font-weight="700" style="fill:#2DD4E8">L5-All-Staff</text><text class="t" x="830" y="568" font-size="11.5" style="fill:#8FA3BF">Kofi &#8594; Branch-Operations &#8594; All-Staff &#8594; Reader</text></g><g class="anim w24"><rect x="812" y="436" width="360" height="150" rx="14" fill="#3A2C10" stroke="#FFC04D" stroke-width="1.4"/><text class="t" x="830" y="464" font-size="13" font-weight="800" style="fill:#FFC04D">Exam trap: licences</text><text class="t" x="830" y="492" font-size="12.5" style="fill:#D6EEF4">A licence given to L5-All-Staff</text><text class="t" x="830" y="512" font-size="12.5" style="fill:#D6EEF4">reaches <tspan font-weight="800" style="fill:#FF6B5E">nobody</tspan>: group-based</text><text class="t" x="830" y="532" font-size="12.5" style="fill:#D6EEF4">licensing ignores nested groups.</text><text class="t" x="830" y="564" font-size="11.5" style="fill:#8FA3BF">Azure roles follow nesting; licences do not.</text></g><g class="anim w25"><rect x="456" y="470" width="136" height="24" rx="12" fill="#3A2C10" stroke="#FFC04D"/><text class="t" x="524" y="486" font-size="11" font-weight="700" text-anchor="middle" style="fill:#FFC04D">licence stops here</text></g><rect x="24" y="620" width="1152" height="52" rx="12" fill="#0A1830" stroke="#1C3050"/><text class="anim w26 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#2BD99F">Users:</tspan> six disabled users, created through Microsoft Graph after the portal's bulk job failed.</text><text class="anim w27 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#2DD4E8">Nesting:</tspan> L5-All-Staff holds two groups and no people. Direct members 2, all members 8.</text><text class="anim w28 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#2BD99F">One assignment:</tspan> Reader on rg-lab-vm goes to L5-All-Staff, not to each person.</text><text class="anim w29 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#2DD4E8">Access flows down:</tspan> Check access on Kofi shows Reader, assigned to L5-All-Staff.</text><text class="anim w30 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#FF6B5E">Guests:</tspan> invited, but in no group, so they get nothing. Membership is the access.</text><text class="anim w31 t" x="44" y="652" font-size="14.5"><tspan font-weight="800" style="fill:#FFC04D">The trap:</tspan> Azure RBAC follows nested groups. Group-based licensing does not.</text><text class="t" x="600.0" y="710" font-size="13" text-anchor="middle" style="fill:#D6EEF4"><tspan font-weight="700" style="fill:#FFC04D">Give roles to groups, not people.</tspan> Adding someone to a team is then the whole access change.</text><text class="t" x="600.0" y="734" font-size="11.5" text-anchor="middle" style="fill:#8FA3BF">Membership type: Assigned. Dynamic groups and group-based licensing need Entra ID P1 or P2.</text></svg>